[package]
name = "sony-headphones-client"
version = "0.1.0"
description = "Sony Headphones Client - Control Sony WH/WF headphones from your desktop"
authors = ["ishaan"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "sony_headphones_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# IOBluetooth bridge is compiled via cc in build.rs (macos_bridge.m)

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

